services:
  # Frontend Service
  frontend:
    build:
      context: ./presentation_layer/the_construct_svelte
      dockerfile: Dockerfile
    container_name: theconstruct-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - API_BASE_URL=http://application-layer:8080
    depends_on:
      - application-layer
    networks:
      - theconstruct-network
    volumes:
      - ./presentation_layer/the_construct_svelte:/app
      - /app/node_modules
    restart: unless-stopped
    
  # Core Application Layer (Modular Monolith)
  application-layer:
    build:
      context: ./application_layer
      dockerfile: Dockerfile
    container_name: theconstruct-application
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - PORT=8080
      - DEBUG=true
      - PYTHONPATH=app
      - ALLOWED_HOSTS=localhost,127.0.0.1,frontend
      - LOG_LEVEL=INFO
      # XRPL Configuration
      - XRPL_TESTNET_URL=wss://s.altnet.rippletest.net:51233
      - XRPL_MAINNET_URL=wss://s1.ripple.com:443
      # MCP Configuration
      - MCP_SERVER_ENABLED=true
      - MCP_SERVER_PORT=8081
    networks:
      - theconstruct-network
    volumes:
      - ./application_layer:/app
    restart: unless-stopped

networks:
  theconstruct-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16