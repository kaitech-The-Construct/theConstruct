services:
  # Frontend Service
  frontend:
    build:
      context: ./presentation_layer/the_construct_svelte
      dockerfile: Dockerfile
    container_name: theconstruct-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - API_BASE_URL=http://application-layer:8080
      - API_GATEWAY_URL=http://api-gateway:8000
    depends_on:
      - application-layer
    networks:
      - theconstruct-network
    volumes:
      - ./presentation_layer/the_construct_svelte:/app
      - /app/node_modules
    restart: unless-stopped
    
  application-layer:
    build:
      context: ./application_layer
      dockerfile: Dockerfile
    container_name: theconstruct-application
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - PORT=8080
      - DEBUG=true
      - ALLOWED_HOSTS=localhost,127.0.0.1,frontend
    networks:
      - theconstruct-network
    volumes:
      - ./application_layer:/app
    restart: unless-stopped